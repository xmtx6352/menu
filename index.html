<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:,">
<title>中国菜 · 八大菜系</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Noto+Serif+SC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2e7;
    --card:#fffdf8;
    --card2:#f3ecdc;
    --ink:#2b2118;
    --muted:#7a6a58;
    --line:#e0d3ba;
    --red:#b03a2e;
    --red-deep:#8c2b21;
    --gold:#b8860b;
    --jade:#3d6b4f;
    --shadow:0 8px 24px rgba(90,60,20,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#1d1712;
      --card:#282019;
      --card2:#332920;
      --ink:#f2e8d8;
      --muted:#b8a78f;
      --line:#453729;
      --red:#e0684f;
      --red-deep:#e0684f;
      --gold:#d9a83e;
      --jade:#7fb894;
      --shadow:0 8px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px 60px}
  /* ---------- 顶栏 ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:12px 18px;margin:0 -18px;
    background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .brand{font-family:"Noto Serif SC",serif;font-weight:900;font-size:16px;letter-spacing:.06em}
  .brand .seal{
    display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;border-radius:5px;background:var(--red);color:#fff;
    font-size:13px;margin-right:8px;vertical-align:-6px;
  }
  .langtoggle{
    display:flex;border:1.5px solid var(--red);border-radius:999px;overflow:hidden;flex:none;
  }
  .langtoggle button{
    border:0;background:transparent;color:var(--red);cursor:pointer;font-family:inherit;
    font-size:13.5px;font-weight:800;padding:7px 15px;
  }
  .langtoggle button[aria-pressed="true"]{background:var(--red);color:#fff}
  /* ---------- 头图区 ---------- */
  .hero{display:grid;grid-template-columns:1fr 1.05fr;gap:26px;align-items:center;padding:30px 0 8px}
  @media (max-width:760px){ .hero{grid-template-columns:1fr;padding-top:20px} }
  .hero h1{
    font-family:"Noto Serif SC",serif;font-weight:900;
    font-size:clamp(34px,5.6vw,50px);line-height:1.18;margin:0 0 12px;letter-spacing:.02em;
  }
  .hero h1 .accent{color:var(--red)}
  .hero .sub{color:var(--muted);font-size:15.5px;margin:0 0 18px;max-width:460px}
  .hero .meta{display:flex;gap:8px;flex-wrap:wrap}
  .chip{
    background:var(--card);border:1px solid var(--line);border-radius:999px;
    padding:6px 13px;font-size:13px;font-weight:700;color:var(--muted);
  }
  .chip strong{color:var(--red);font-size:15px}
  .hero img{
    width:100%;height:auto;display:block;border-radius:18px;
    border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .randomrow{margin-top:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{
    border:0;border-radius:12px;padding:12px 20px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;
    background:var(--red);color:#fff;
  }
  .btn:active{transform:translateY(1px)}
  .pick{font-size:14.5px;color:var(--muted)}
  .pick strong{color:var(--ink);font-size:16px}
  .pick .price{color:var(--red);font-weight:900}
  /* ---------- 菜系导航 ---------- */
  .nav{
    position:sticky;top:55px;z-index:15;
    display:flex;gap:8px;flex-wrap:wrap;
    padding:12px 0 10px;
    background:color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .nav button{
    border:1px solid var(--line);background:var(--card);color:var(--muted);
    padding:9px 17px;border-radius:999px;font-size:14.5px;font-weight:800;cursor:pointer;font-family:inherit;
  }
  .nav button[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
  /* ---------- 菜系区块 ---------- */
  section.cuisine{margin-top:34px;scroll-margin-top:130px}
  .c-head{display:flex;gap:16px;align-items:flex-start;border-bottom:2px solid var(--red);padding-bottom:12px}
  .c-badge{
    font-family:"Noto Serif SC",serif;font-weight:900;font-size:30px;line-height:1;
    width:58px;height:58px;flex:none;border-radius:10px;
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .c-head h2{font-family:"Noto Serif SC",serif;font-size:clamp(23px,3.6vw,29px);margin:0;line-height:1.25}
  .c-head h2 .en{font-size:15px;color:var(--muted);font-family:"Noto Sans SC",sans-serif;font-weight:700;margin-left:8px;letter-spacing:.03em}
  .c-head .flavor{margin:3px 0 0;color:var(--red-deep);font-weight:700;font-size:14.5px}
  .c-head .region{margin:0;color:var(--muted);font-size:13px}
  .dishes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
  @media (max-width:860px){ .dishes{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:520px){ .dishes{grid-template-columns:1fr} }
  .dish{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 17px;position:relative;
  }
  .dish.flash{outline:3px solid var(--gold);outline-offset:2px}
  .dish .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .dish h3{margin:0;font-family:"Noto Serif SC",serif;font-size:18px;line-height:1.35}
  .dish .price{color:var(--red);font-weight:900;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .dish .en-name{font-size:12.5px;color:var(--gold);font-weight:700;letter-spacing:.02em;margin-top:1px}
  .dish p{margin:7px 0 0;font-size:13.5px;color:var(--muted);line-height:1.55}
  .tags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  .tag{font-size:11.5px;font-weight:800;border-radius:999px;padding:2.5px 9px}
  .tag.sig{background:var(--red);color:#fff}
  .tag.spicy{background:var(--card2);color:var(--red-deep);border:1px solid var(--line)}
  /* ---------- 页脚 ---------- */
  footer{text-align:center;color:var(--muted);font-size:12.5px;margin-top:52px}
</style>
</head>

<div class="wrap">

  <div class="topbar">
    <div class="brand"><span class="seal">菜</span><span data-ui="brand">中国菜 · 八大菜系</span></div>
    <div class="langtoggle" role="group" aria-label="Language / 语言切换">
      <button type="button" id="btnZh" aria-pressed="true">中文</button>

  </div>

      <div class="meta">
        <span class="chip"><strong>8</strong> <span data-ui="chipCuisines">大菜系</span></span>

        <span class="chip" data-ui="chipNote">价格为家常参考价</span>

      <div class="randomrow">
        <button class="btn" type="button" id="randomBtn" data-ui="randomBtn">🎲 不知道吃什么，抽一道</button>
        <span class="pick" id="pick"></span>
      </div>

var lang = "zh";
var nav = document.getElementById("cuisineNav");
var main = document.getElementById("menuMain");
var currentFilter = "all";

function dishName(d){ return lang === "zh" ? d.zh : d.en; }
function dishSub(d){ return lang === "zh" ? d.en : d.zh; }
function dishDesc(d){ return lang === "zh" ? d.dz : d.de; }
function cuiName(c){ return lang === "zh" ? c.zh : c.en; }
function cuiSub(c){ return lang === "zh" ? c.en : c.zh; }

function render(){
  var t = UI[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = t.title;
  document.querySelectorAll("[data-ui]").forEach(function(el){
    var k = el.getAttribute("data-ui"); if(t[k]) el.textContent = t[k];
  });
  document.getElementById("btnZh").setAttribute("aria-pressed", lang === "zh" ? "true" : "false");
  document.getElementById("btnEn").setAttribute("aria-pressed", lang === "en" ? "true" : "false");
  document.getElementById("heroTitle").innerHTML = lang === "zh"
    ? '中国菜 <span class="accent">·</span> 八大菜系'
    : 'Chinese Cuisine <span class="accent">·</span> Eight Great Traditions';
  document.getElementById("heroImg").alt = t.heroAlt;
  document.getElementById("pick").textContent = "";

  nav.innerHTML = "";
  var allBtn = document.createElement("button");
  allBtn.type = "button"; allBtn.textContent = t.all;
  allBtn.setAttribute("aria-pressed", currentFilter === "all" ? "true" : "false");
  allBtn.addEventListener("click", function(){ setFilter("all"); });
  nav.appendChild(allBtn);
  CUISINES.forEach(function(c){
    var b = document.createElement("button");
    b.type = "button"; b.textContent = cuiName(c);
    b.setAttribute("aria-pressed", currentFilter === c.id ? "true" : "false");
    b.addEventListener("click", function(){ setFilter(c.id); });
    nav.appendChild(b);
  });

  main.innerHTML = "";
  CUISINES.forEach(function(c){
    if(currentFilter !== "all" && currentFilter !== c.id) return;
    var sec = document.createElement("section");
    sec.className = "cuisine"; sec.id = "c-" + c.id;
    var head = document.createElement("div"); head.className = "c-head";
    head.innerHTML = '<span class="c-badge" style="background:' + c.color + '">' + c.badge + '</span>';
    var ht = document.createElement("div");
    var h2 = document.createElement("h2");
    h2.appendChild(document.createTextNode(cuiName(c)));
    var enSpan = document.createElement("span"); enSpan.className = "en"; enSpan.textContent = cuiSub(c);
    h2.appendChild(enSpan);
    var fl = document.createElement("p"); fl.className = "flavor";
    fl.textContent = lang === "zh" ? c.flavorZh : c.flavorEn;
    var rg = document.createElement("p"); rg.className = "region";
    rg.textContent = lang === "zh" ? c.regionZh : c.regionEn;
    ht.appendChild(h2); ht.appendChild(fl); ht.appendChild(rg);
    head.appendChild(ht); sec.appendChild(head);

    var grid = document.createElement("div"); grid.className = "dishes";
    c.dishes.forEach(function(d, i){
      var card = document.createElement("article");
      card.className = "dish"; card.setAttribute("data-cui", c.id); card.setAttribute("data-idx", i);
      var row = document.createElement("div"); row.className = "row";
      var h3 = document.createElement("h3"); h3.textContent = dishName(d);
      var pr = document.createElement("span"); pr.className = "price"; pr.textContent = "¥" + d.price;
      row.appendChild(h3); row.appendChild(pr);
      var sub = document.createElement("div"); sub.className = "en-name"; sub.textContent = dishSub(d);
      var p = document.createElement("p"); p.textContent = dishDesc(d);
      card.appendChild(row); card.appendChild(sub); card.appendChild(p);
      var tags = document.createElement("div"); tags.className = "tags";
      if(d.sig){
        var s = document.createElement("span"); s.className = "tag sig"; s.textContent = t.sig; tags.appendChild(s);
      }
      if(d.spicy > 0){
        var sp = document.createElement("span"); sp.className = "tag spicy";
        var ch = ""; for(var k = 0; k < d.spicy; k++) ch += "🌶";
        sp.textContent = t.spicy + " " + ch; tags.appendChild(sp);
      }
      if(tags.children.length) card.appendChild(tags);
      grid.appendChild(card);
    });
    sec.appendChild(grid);
    main.appendChild(sec);
  });
}

function setFilter(id){
  currentFilter = id;
  render();
  if(id !== "all"){
    var el = document.getElementById("c-" + id);
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  } else {
    window.scrollTo({top: nav.offsetTop - 70, behavior:"smooth"});
  }
}

document.getElementById("btnZh").addEventListener("click", function(){ lang = "zh"; render(); });
document.getElementById("btnEn").addEventListener("click", function(){ lang = "en"; render(); });

document.getElementById("randomBtn").addEventListener("click", function(){
  var c = CUISINES[Math.floor(Math.random() * CUISINES.length)];
  var d = c.dishes[Math.floor(Math.random() * c.dishes.length)];
  var t = UI[lang];
  if(currentFilter !== "all" && currentFilter !== c.id){ currentFilter = "all"; render(); }
  var pick = document.getElementById("pick");
  pick.innerHTML = "";
  pick.appendChild(document.createTextNode(t.from + " "));
  var strong = document.createElement("strong"); strong.textContent = cuiName(c) + " · " + dishName(d);
  pick.appendChild(strong);
  var price = document.createElement("span"); price.className = "price"; price.textContent = " ¥" + d.price;
  pick.appendChild(price);
  var card = main.querySelector('[data-cui="' + c.id + '"][data-idx="' + c.dishes.indexOf(d) + '"]');
  if(card){
    main.querySelectorAll(".dish").forEach(function(x){ x.classList.remove("flash"); });
    card.classList.add("flash");
    setTimeout(function(){ card.scrollIntoView({behavior:"smooth", block:"center"}); }, 60);
  }
});

render();
})();
</script>
